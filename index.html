<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centered Images and GIFs</title>
  <style>
    body {
      background-color: gray;
      font-family: Arial, sans-serif;
    }

    .center {
      display: block;
      margin-left: auto;
      margin-right: auto;
      width: 50%; /* adjust as needed */
    }

    .spacer {
      margin-top: 40px; /* space between images */
    }
  </style>
</head>

<body>
  <!-- KAPAK image at the top -->
  <img class="center" src="images/KAPAK copy.jpg" alt="Kapak">

  <!-- First image -->
  <img class="center spacer" src="images/İçindekiler copy.jpg" alt="İçindekiler">

  <!-- First GIF -->
  <img class="center spacer" src="kurulum.gif" alt="Kurulum GIF">

  <!-- Added GIF -->
  <img class="center spacer" src="kullanım.gif" alt="Kullanım GIF">

  <!-- Added JPEG -->
  <img class="center spacer" src="son sayfa.gif" alt="Son Sayfa">

  <!-- Added JPEG -->
  <img class="center spacer" src="images/garanti copy.jpg" alt="Garanti">
</body>

</html>
